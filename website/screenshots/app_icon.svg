<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="40%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#06120A"/>
    </linearGradient>

    <!-- Ambient Glow Top-Left -->
    <radialGradient id="glowTL" cx="20" cy="20" r="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1ED760" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Glow Bottom-Right -->
    <radialGradient id="glowBR" cx="85" cy="85" r="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D7E31" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Platter Body Gradient -->
    <linearGradient id="platterGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="50%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <!-- Platter Stroke Gradient -->
    <linearGradient id="platterStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ED760" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#121212" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D7E31" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Soundwave Bars Gradient -->
    <linearGradient id="barGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5CFF90"/>
      <stop offset="30%" stop-color="#1ED760"/>
      <stop offset="70%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#0A5B27"/>
    </linearGradient>
  </defs>

  <!-- 1. Background Base -->
  <rect width="108" height="108" fill="url(#bgGrad)"/>

  <!-- 2. Ambient Lighting Glows -->
  <rect width="108" height="108" fill="url(#glowTL)"/>
  <rect width="108" height="108" fill="url(#glowBR)"/>

  <!-- 3. Center Platter Shadow -->
  <circle cx="54" cy="55.5" r="36" fill="#000000" opacity="0.45"/>

  <!-- 4. Center Platter Body -->
  <circle cx="54" cy="54" r="36" fill="url(#platterGrad)"/>

  <!-- 5. Platter Inner Rim Glow -->
  <circle cx="54" cy="54" r="35.5" fill="none" stroke="url(#platterStrokeGrad)" stroke-width="1.2"/>

  <!-- 6. Soundwave Bars Drop Shadow -->
  <g fill="#000000" opacity="0.5">
    <path d="M39.5,46.5c-1.66,0 -3,1.34 -3,3v14c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-14c0,-1.66 -1.34,-3 -3,-3z"/>
    <path d="M49.5,36.5c-1.66,0 -3,1.34 -3,3v34c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-34c0,-1.66 -1.34,-3 -3,-3z"/>
    <path d="M59.5,28.5c-1.66,0 -3,1.34 -3,3v50c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-50c0,-1.66 -1.34,-3 -3,-3z"/>
    <path d="M69.5,40.5c-1.66,0 -3,1.34 -3,3v26c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-26c0,-1.66 -1.34,-3 -3,-3z"/>
    <path d="M79.5,50.5c-1.66,0 -3,1.34 -3,3v6c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-6c0,-1.66 -1.34,-3 -3,-3z"/>
  </g>

  <!-- 7. Soundwave Bars (Cylindrical High-Depth Colors) -->
  <g fill="url(#barGrad)">
    <path d="M38,44c-1.66,0 -3,1.34 -3,3v14c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-14c0,-1.66 -1.34,-3 -3,-3z"/>
    <path d="M48,34c-1.66,0 -3,1.34 -3,3v34c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-34c0,-1.66 -1.34,-3 -3,-3z"/>
    <path d="M58,26c-1.66,0 -3,1.34 -3,3v50c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-50c0,-1.66 -1.34,-3 -3,-3z"/>
    <path d="M68,38c-1.66,0 -3,1.34 -3,3v26c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-26c0,-1.66 -1.34,-3 -3,-3z"/>
    <path d="M78,48c-1.66,0 -3,1.34 -3,3v6c0,1.66 1.34,3 3,3s3,-1.34 3,-3v-6c0,-1.66 -1.34,-3 -3,-3z"/>
  </g>

  <!-- 8. Glossy Cylindrical Highlights (Reflective Lighting Overlays) -->
  <g fill="#FFFFFF" opacity="0.30">
    <path d="M36.5,45.5c-0.8,0 -1.5,0.7 -1.5,1.5v11c0,0.8 0.7,1.5 1.5,1.5s0.5,-0.7 0.5,-1.5v-11c0,-0.8 -0.2,-1.5 -0.5,-1.5z"/>
    <path d="M46.5,35.5c-0.8,0 -1.5,0.7 -1.5,1.5v31c0,0.8 0.7,1.5 1.5,1.5s0.5,-0.7 0.5,-1.5v-31c0,-0.8 -0.2,-1.5 -0.5,-1.5z"/>
    <path d="M56.5,27.5c-0.8,0 -1.5,0.7 -1.5,1.5v47c0,0.8 0.7,1.5 1.5,1.5s0.5,-0.7 0.5,-1.5v-47c0,-0.8 -0.2,-1.5 -0.5,-1.5z"/>
    <path d="M66.5,39.5c-0.8,0 -1.5,0.7 -1.5,1.5v23c0,0.8 0.7,1.5 1.5,1.5s0.5,-0.7 0.5,-1.5v-23c0,-0.8 -0.2,-1.5 -0.5,-1.5z"/>
    <path d="M76.5,49.5c-0.8,0 -1.5,0.7 -1.5,1.5v9c0,0.8 0.7,1.5 1.5,1.5s0.5,-0.7 0.5,-1.5v-9c0,-0.8 -0.2,-1.5 -0.5,-1.5z"/>
  </g>
</svg>
